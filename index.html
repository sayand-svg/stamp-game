<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>แสตมป์คำ คาบที่ 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&family=Sriracha&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: teacher = stage + scoreboard rail over a grid of group cards; group screen = one column card. Stamps are Thai-post style perforated stamps priced in baht. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --sunk:#E8ECF5; --ink:#1C2541; --muted:#58627A; --line:#C9D0E0;
  --accent:#C8321C; --accent-ink:#FFFFFF; --good:#1F7A4D; --bad:#B3261E; --warn:#A86A00;
  --gold:#F2B630; --veil:#0E1220;
  --s1:#2E7D5B; --s3:#2B5FA8; --s5:#6A3FA0; --s7:#C9611B; --s10:#C8321C; --stamp-ink:#FFFFFF;
  --f-display:'Mitr','Leelawadee UI',Tahoma,sans-serif; --f-body:'Sarabun','Leelawadee UI',Tahoma,sans-serif; --f-hand:'Sriracha','Mitr',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1320; --surface:#181E2F; --sunk:#222A3F; --ink:#E7EBF5; --muted:#A3ADC4; --line:#323C56;
  --accent:#F0644B; --accent-ink:#1A0E0B; --good:#4FC48A; --bad:#FF7B70; --warn:#F2B94B;
  --s1:#3E9C73; --s3:#4A7FCC; --s5:#8B62C4; --s7:#E07B34; --s10:#E2533B; --stamp-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1320; --surface:#181E2F; --sunk:#222A3F; --ink:#E7EBF5; --muted:#A3ADC4; --line:#323C56;
  --accent:#F0644B; --accent-ink:#1A0E0B; --good:#4FC48A; --bad:#FF7B70; --warn:#F2B94B;
  --s1:#3E9C73; --s3:#4A7FCC; --s5:#8B62C4; --s7:#E07B34; --s10:#E2533B; --stamp-ink:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.3}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:24px}
.brand small{font-family:var(--f-display);color:var(--muted);font-size:13px;letter-spacing:.03em}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-family:var(--f-display);font-size:13px;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)}
.note{background:var(--sunk);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--muted)}
.note b{color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{border:2px solid var(--ink)}
.eyebrow{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;color:var(--accent)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-family:var(--f-display);font-size:13px;border:1.5px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px}
.step[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:8px;padding:7px 14px;font-family:var(--f-display);font-size:15px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.sentence{font-family:var(--f-display);font-weight:500;font-size:clamp(22px,3.4vw,34px);line-height:1.45}
.stagehead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.stagehead > div{min-width:0;flex:1 1 320px;display:flex;flex-direction:column;gap:8px}
/* stamp */
.stamp{--c:var(--s10);background:var(--c);color:var(--stamp-ink);border:6px dotted var(--surface);outline:1.5px solid var(--c);outline-offset:-1px;
  width:118px;min-height:140px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;flex:none;border-radius:2px;
  box-shadow:0 2px 0 var(--line)}
.stamp .sv{font-family:var(--f-display);font-weight:600;font-size:52px;line-height:1}
.stamp .sl{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;opacity:.92}
.stamp .sb{font-family:var(--f-display);font-size:15px}
.stamp.blank{--c:var(--sunk);color:var(--muted)}
.stamp.v1{--c:var(--s1)}.stamp.v3{--c:var(--s3)}.stamp.v5{--c:var(--s5)}.stamp.v7{--c:var(--s7)}.stamp.v10{--c:var(--s10)}
.stamp.hit{animation:hit .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes hit{0%{transform:scale(1.6) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.mini{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;padding:0 6px;border:3px dotted var(--surface);outline:1px solid var(--line);font-family:var(--f-display);font-size:13px;color:var(--stamp-ink);background:var(--s10)}
.mini.v1{background:var(--s1)}.mini.v3{background:var(--s3)}.mini.v5{background:var(--s5)}.mini.v7{background:var(--s7)}
.picker{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.picker .mini{cursor:pointer;height:30px;min-width:40px;font-size:15px}
.picker .mini[aria-pressed="true"]{outline:3px solid var(--ink)}
/* groups */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.gcard{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.gcard.ok{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.gcard.no{border-color:var(--bad)}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gname{font-family:var(--f-display);font-weight:600;font-size:17px;display:flex;gap:6px;align-items:center}
.ans{background:var(--sunk);border-radius:6px;padding:8px 10px;font-size:15px;min-height:42px;overflow-wrap:anywhere}
.ans.empty{color:var(--muted);font-style:italic}
.tag{font-family:var(--f-display);font-size:12px;border-radius:4px;padding:1px 7px;background:var(--ink);color:var(--bg)}
.tag.good{background:var(--good);color:var(--surface)}
.judge{display:flex;gap:6px}
.judge .btn{flex:1}
.judge .btn[aria-pressed="true"].yes{background:var(--good);border-color:var(--good);color:var(--surface)}
.judge .btn[aria-pressed="true"].noo{background:var(--bad);border-color:var(--bad);color:var(--surface)}
/* scoreboard */
.board{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--sunk)}
.brow .rk{font-family:var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.brow .nm{font-family:var(--f-display);font-weight:500}
.brow .tt{font-family:var(--f-display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.brow .adj{display:flex;gap:2px}
.brow .adj button{border:1px solid var(--line);background:var(--surface);border-radius:4px;width:24px;height:24px;line-height:1;padding:0}
.brow.me{outline:2px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:3px;grid-column:2 / -1}
/* ladder */
.ladder{display:flex;flex-direction:column;gap:12px}
.lset{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.lset h3{font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cards{display:flex;gap:8px;flex-wrap:wrap}
.wcard{border:1.5px solid var(--ink);background:var(--surface);border-radius:8px;padding:6px 14px;font-family:var(--f-display);font-size:18px}
.wcard[disabled]{opacity:.3}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:end}
.slot{border:1.5px dashed var(--line);border-radius:8px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-size:17px;background:var(--sunk);padding:4px;text-align:center}
.slot small{font-size:11px;color:var(--muted)}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--surface)}
.slot:nth-child(1){min-height:46px}.slot:nth-child(2){min-height:58px}.slot:nth-child(3){min-height:70px}
.mark{font-family:var(--f-display);font-size:13px}
.mark.y{color:var(--good)}.mark.n{color:var(--bad)}
textarea{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);resize:vertical;font-size:18px}
.reveal{border-left:5px solid var(--good);background:var(--sunk);padding:10px 14px;border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:4px}
.reveal .fix{font-family:var(--f-hand);font-size:22px;color:var(--good)}
.status{font-family:var(--f-display);font-size:14px;color:var(--muted)}
.status.ok{color:var(--good)}
.big-result{font-family:var(--f-display);font-size:20px;padding:10px 14px;border-radius:8px;background:var(--sunk);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.timer{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:15px}
.timer.low{color:var(--bad)}
.grouppick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.grouppick .btn{font-size:20px;padding:16px 8px}
.wordpick{display:flex;flex-wrap:wrap;gap:6px}
.wordpick .wcard{font-size:16px;padding:4px 10px}
.wordpick .wcard[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.podium{display:flex;flex-direction:column;gap:8px}
.podium .brow{font-size:18px}
.confirm{color:var(--bad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.stampimg{width:150px;height:auto;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.stampimg.hit{animation:hit .5s cubic-bezier(.2,1.6,.4,1)}
.minimg{height:30px;width:auto;vertical-align:middle}
.pick{border:2px solid transparent;background:none;border-radius:8px;padding:2px;line-height:0}
.pick img{height:45px;width:auto}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--sunk)}
@media (max-width:520px){.stampimg{width:110px}}
.slapboard{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:760px){.slapboard{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:520px){.slapboard{grid-template-columns:repeat(3,minmax(0,1fr))}}
.slapw{border:2px solid var(--ink);border-radius:10px;background:var(--surface);min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 4px;font-family:var(--f-display);font-weight:500;font-size:clamp(14px,1.55vw,20px);white-space:nowrap}
.slapw.hit{background:var(--good);border-color:var(--good);color:var(--surface);transform:scale(1.04)}
.versus{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vs-team{font-family:var(--f-display);font-size:22px;font-weight:600;display:inline-flex;align-items:baseline;gap:10px;border:2px solid var(--ink);border-radius:10px;padding:4px 14px}
.vs-team b{font-size:30px;color:var(--accent);font-variant-numeric:tabular-nums}
.vs{font-family:var(--f-hand);font-size:26px;color:var(--accent)}
.gap{display:inline-block;min-width:4em;border-bottom:3px solid var(--accent)}
.scorepad{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--f-display)}
.yesb{border-color:var(--good);color:var(--good)}.nob{border-color:var(--bad);color:var(--bad)}
.goldtag{align-self:flex-start;font-family:var(--f-display);font-size:14px;font-weight:600;background:var(--gold);color:#3A2600;border-radius:999px;padding:3px 12px}
.goldline{text-shadow:0 0 18px var(--gold)}
#fx{position:fixed;inset:0;z-index:50;background:var(--veil);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:#fff;cursor:default}
#fx[hidden]{display:none}
.fxbox{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:920px;width:100%;text-align:center}
.fxeyebrow{font-family:var(--f-display);font-size:15px;letter-spacing:.06em;color:#FFD27A}
.fxtitle{font-size:clamp(28px,5vw,48px);color:#fff}
.fxpair{display:flex;align-items:center;gap:18px}
.fxslot{font-family:var(--f-display);font-weight:600;font-size:clamp(34px,6vw,64px);min-width:2.2em;padding:4px 16px;border-radius:14px;border:3px solid rgba(255,255,255,.5);background:rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
.fxslot.spin{color:rgba(255,255,255,.55)}
.fxslot.lock{border-color:#FFD27A;background:#C8321C;animation:slam .35s cubic-bezier(.2,1.6,.4,1)}
.fxvs{font-family:var(--f-hand);font-size:clamp(26px,4vw,40px);color:#FFD27A}
.fxbye{font-family:var(--f-display);font-size:20px;opacity:0;transition:opacity .4s}
.fxbye.show{opacity:1}
.fxdeck{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;width:100%;max-width:640px}
.fxcard{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,3vw,30px);aspect-ratio:3/4;display:grid;place-items:center;border-radius:10px;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);max-width:100%}
.fxcard.used{opacity:.22;border-style:dashed}
.fxcard.on{background:#FFD27A;color:#2A1C00;border-color:#FFD27A;transform:translateY(-6px)}
.fxcard.pick{background:#C8321C;color:#fff;border-color:#FFD27A;transform:translateY(-10px) scale(1.12);animation:slam .4s cubic-bezier(.2,1.6,.4,1)}
.fxbig{min-height:120px;display:grid;place-items:center}
.fxnum{font-family:var(--f-display);font-weight:600;font-size:clamp(80px,14vw,140px);line-height:1;animation:pop .7s ease-out both}
.fxnum.go{color:#FFD27A;font-family:var(--f-hand)}
.fxgold{font-family:var(--f-hand);font-size:clamp(44px,8vw,80px);color:#FFD27A;display:flex;flex-direction:column;align-items:center;line-height:1.1;animation:slam .5s cubic-bezier(.2,1.6,.4,1)}
.fxgold small{font-family:var(--f-display);font-size:20px;color:#fff}
.fxhint{font-size:13px;opacity:.6}
@keyframes slam{0%{transform:scale(1.7);opacity:0}100%{opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:.85}}
@media (max-width:520px){.fxdeck{grid-template-columns:repeat(5,minmax(0,1fr))}}
.rulecard{display:flex;flex-direction:column;gap:6px;font-family:var(--f-display);font-size:15px;flex:none}
.rulecard span{display:flex;align-items:center;gap:8px}
.rulecard .minimg{height:52px}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
.fxbonus{width:170px;height:auto;animation:slam .5s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 6px 18px rgba(0,0,0,.4))}
.qrwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-top:1.5px dashed var(--line);padding-top:12px}
.qr{background:#fff;padding:8px;border-radius:8px;line-height:0;flex:none}
.qr img,.qr canvas{display:block}
.qrtext{display:flex;flex-direction:column;gap:6px;min-width:0}
.link{font-size:15px;background:var(--sunk);padding:6px 10px;border-radius:6px;overflow-wrap:anywhere}
.qrsmall{display:flex;gap:10px;align-items:center}
.roomin{border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);font-size:18px;width:9em;max-width:100%}
@media (prefers-reduced-motion:reduce){.stamp.hit,.stampimg.hit{animation:none}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <div class="brand"><h1>แสตมป์คำ</h1><small>ภาษาไทย 6 · ท33102 · คาบที่ 2</small></div>
    <div class="pills"><span class="pill"><span class="dot"></span>กำลังเชื่อมต่อห้องเรียน…</span></div>
  </div>
  <div class="panel stage"><span class="eyebrow">กิจกรรมคาบที่ 2</span><h2>ประโยคปรบมือจับผิด แล้วต่อด้วยบันไดน้ำหนักคำ</h2><p>กำลังโหลด…</p></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- content ---------- */
const CLAP = [
  {text:'บิดาของข้าพเจ้าชอบกินกาแฟตอนเช้า', trick:false,
   fix:'บิดาของข้าพเจ้าชอบดื่มกาแฟในตอนเช้า',
   note:'"บิดา ข้าพเจ้า" เป็นภาษาทางการ แต่ "กิน" กับ "ตอนเช้า" เป็นภาษาปาก ถ้ากลุ่มปรับลงทั้งประโยคเป็น "พ่อของฉันชอบกินกาแฟตอนเช้า" ก็ใช้ระดับเดียวกันตลอดเช่นกัน'},
  {text:'โรงเรียนจะปิดเทอมในสัปดาห์หน้า', trick:false,
   fix:'โรงเรียนจะปิดภาคเรียนในสัปดาห์หน้า',
   note:'"ปิดเทอม" เป็นภาษาปาก ส่วน "สัปดาห์" เป็นภาษาเขียน ใช้ "ปิดภาคเรียน" ให้ระดับเดียวกัน'},
  {text:'ข้าพเจ้าเดินทางไปเยี่ยมมารดาที่โรงพยาบาลทุกวัน', trick:true,
   fix:'ประโยคนี้ถูกต้องแล้ว ไม่ต้องแก้',
   note:'ข้อหลอก ทุกคำอยู่ในระดับทางการเดียวกัน กลุ่มที่กด "ประโยคนี้ถูกแล้ว" ได้แสตมป์'},

function wrongCount(ans){
  let w = 0;
  LADDER.forEach((L,i)=>{
    const a = ans && ans[i];
    if(!Array.isArray(a) || a.length!==3 || a.some((x,j)=>x!==L.order[j])) w++;
  });
  return w;
}
function earned(g){
  const out = [];
  ['s0','s1','s2','s3'].forEach(k=>{ if(S.res[k] && S.res[k][g]===true && S.stamps[k]) out.push(S.stamps[k]); });
  const lw = S.res.ladder && S.res.ladder[g];
  if(typeof lw==='number' && LADDER_PAY[lw]>0) out.push(LADDER_PAY[lw]);
  if(S.res.compose && S.res.compose[g]===true) out.push(10);
  (S.bt||[]).forEach(x=>{ if(x.g==g) out.push(x.v); });
  return out;
}
function ensure(){
  const d=fresh(S.groups||6);
  Object.keys(d).forEach(k=>{ if(k!=='gid' && S[k]===undefined) S[k]=d[k]; });
  ['stamps','snap','res','adj'].forEach(k=>{ if(!S[k]||typeof S[k]!=='object') S[k]={}; });
  if(!Array.isArray(S.bt)) S.bt = S.bt ? Object.values(S.bt) : [];
  if(!S.battle) S.battle=freshBattle();
  const fb=freshBattle(); Object.keys(fb).forEach(k=>{ if(S.battle[k]===undefined) S.battle[k]=fb[k]; });
  ['pairs','ev','used','hist'].forEach(k=>{ const v=S.battle[k]; S.battle[k]=Array.isArray(v)?v.filter(x=>x!=null):(v?Object.values(v):[]); });
  S.battle.hist.forEach(h=>{ if(!Array.isArray(h.win)) h.win = h.win ? Object.values(h.win) : []; });
  if(!S.battle.byes) S.battle.byes={};
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function bScore(g){ return (S.battle.ev||[]).filter(e=>e.g==g).reduce((s,e)=>s+(e.v||0),0); }
function total(g){ return earned(g).reduce((a,b)=>a+b,0) + (Number(S.adj[g])||0); }

  if(roomId) lsSet(tkey(), S);

async function push(){
  if(!stateRef) return;
  if(writing){dirty=true;return;}

  catch(e){ if(String(e&&e.code||e).toUpperCase().includes('PERMISSION')){ authErr = `บัญชี ${user?user.email:''} ไม่มีสิทธิ์ควบคุมเกม ออกจากระบบแล้วเข้าด้วยบัญชีครูที่ตั้งไว้`; render(); } else flash('บันทึกไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง'); }
  writing=false;
  if(dirty){dirty=false; push();}
}

/* ---------- teacher: live answers from group presence ---------- */
function buildLive(){
  live={};
  for(let g=1; g<=8; g++){
    const a=answersData && answersData[g], o=onlineData && onlineData[g];
    if(a||o) live[g]={ans:(a&&typeof a==='object')?a:{}, online: !!(o && Object.keys(o).length)};
  }
}
function answerFor(g,k){
  if(!S.open && S.snap[k] && g in S.snap[k]) return S.snap[k][g];
  const l = live[g];
  return l && l.ans ? l.ans[k] : undefined;
}

/* ---------- teacher actions ---------- */
const T = {
  go(i){ if(i<0||i>=STEPS.length) return; S.step=i; S.open=true; S.reveal=false; S.timer=null; commit(); },
  groups(n){ S.groups=Math.max(4,Math.min(8,n)); commit(); },
  lock(){
    const k=stepKey(); S.open=false; S.snap[k]={};
    groupsList().forEach(g=>{ const a=live[g]&&live[g].ans?live[g].ans[k]:undefined; if(a!==undefined) S.snap[k][g]=a; });
    if(k==='ladder'){ S.res.ladder=S.res.ladder||{}; groupsList().forEach(g=>{ if(typeof S.res.ladder[g]!=='number' && S.snap.ladder[g]!==undefined) S.res.ladder[g]=wrongCount(S.snap.ladder[g]); }); }
    S.timer=null; commit();
  },
  unlock(){ S.open=true; S.reveal=false; commit(); },
  reveal(){ if(S.open) T.lock(); S.reveal=true; commit(); },
  judge(k,g,val){ S.res[k]=S.res[k]||{}; S.res[k][g] = (S.res[k][g]===val)? null : val; if(S.res[k][g]===null) delete S.res[k][g]; commit(); },
  ladderWrong(g,w){ S.res.ladder=S.res.ladder||{}; if(w==='') delete S.res.ladder[g]; else S.res.ladder[g]=Number(w); commit(); },
  stamp(v){ S.stamps[stepKey()]=v; commit(); },
  spin(){
    if(spinning) return;
    const k=stepKey(); let n=0;
    spinning=setInterval(()=>{
      const el=$('#stage-stamp');
      if(el) el.innerHTML=stampHTML(STAMPS[n++%STAMPS.length]);
      beep(700+n*40,.04);
      if(n>14){ clearInterval(spinning); spinning=null; const pv=STAMPS[Math.floor(Math.random()*STAMPS.length)]; S.stamps[k]=pv; justStamped=k; commit();
        beep(180,.2,'triangle',.14); setTimeout(()=>beep(523,.12,'triangle',.08),160); setTimeout(()=>beep(784,.3,'triangle',.08),300); }
    },85);
  },
  bPer(n){ S.battle.per=n; commit(); },
  bPair(){
    const B=S.battle; let pool=groupsList(), bye=null;
    if(pool.length%2){ const min=Math.min(...pool.map(g=>B.byes[g]||0)); const c=pool.filter(g=>(B.byes[g]||0)===min); bye=c[Math.floor(Math.random()*c.length)]; pool=pool.filter(g=>g!==bye); B.byes[bye]=(B.byes[bye]||0)+1; }
    const met=new Set(B.hist.map(h=>[h.a,h.b].sort((x,y)=>x-y).join('-')));
    let best=null, bestRep=1e9;
    for(let n=0;n<400;n++){ const sh=shuffle(pool), pr=[]; for(let i=0;i<sh.length;i+=2) pr.push([sh[i],sh[i+1]]);
      const r=pr.filter(x=>met.has(x.slice().sort((p,q)=>p-q).join('-'))).length; if(r<bestRep){best=pr;bestRep=r;} if(!r) break; }
    Object.assign(B,{pairs:best, bye, cur:0, round:(B.round||0)+1, qn:0, q:null, show:false, ev:[], stamp:null, note:'', gold:false});
    B.fx={type:'pair', id:((B.fx&&B.fx.id)||0)+1, at:now()};
    commit(); maybeFx();
  },
  bDraw(){
    const B=S.battle; if(B.cur>=B.pairs.length || B.qn>=B.per) return;
    let pool=SLAP.map((_,i)=>i).filter(i=>!B.used.includes(i)); B.note='';
    if(!pool.length){ B.used=[]; pool=SLAP.map((_,i)=>i); B.note='ใช้ประโยคครบ 14 ข้อแล้ว ระบบเริ่มวนประโยคชุดเดิมใหม่'; }
    const q=pool[Math.floor(Math.random()*pool.length)];
    B.used.push(q); B.q=q; B.qn++; B.show=false; B.gold=false;
    B.fx={type:'draw', id:((B.fx&&B.fx.id)||0)+1, at:now()};
    commit(); maybeFx();
  },
  bShow(){ const B=S.battle; B.show=true; B.fx={type:'reveal', id:((B.fx&&B.fx.id)||0)+1, at:now()}; commit(); maybeFx(); },
  bHit(g){
    const B=S.battle; if(B.q==null) return;
    const hits=B.ev.filter(e=>e.qn===B.qn);
    if(hits.some(e=>e.g==g) || hits.length>=2) return;
    const v = hits.length ? 3 : 5;
    B.ev.push({g, v, qn:B.qn});
    S.bt.push({g, v, r:B.round, b:B.cur, qn:B.qn});
    commit();
  },
  bGold(){ S.battle.goldOn = S.battle.goldOn===false; commit(); },
  bUndo(){
    const B=S.battle, e=B.ev.pop(); if(!e) return;
    for(let i=S.bt.length-1;i>=0;i--){ const x=S.bt[i]; if(x.g==e.g && x.v===e.v && x.r===B.round && x.b===B.cur && x.qn===e.qn){ S.bt.splice(i,1); break; } }
    commit();
  },
  bStamp(v){ S.battle.stamp=v; commit(); },
  bEnd(){
    const B=S.battle, p=B.pairs[B.cur]; if(!p) return;
    const [a,b]=p, sa=bScore(a), sb=bScore(b);
    const win = sa>sb?[a]:(sb>sa?[b]:[]);
    if(win.length) S.bt.push({g:win[0], v:3, r:B.round, b:B.cur, bonus:true});
    B.hist.push({a,b,sa,sb,win,r:B.round});
    B.fx={type:'win', id:((B.fx&&B.fx.id)||0)+1, at:now(), a, b, sa, sb, w: win[0]||null};
    Object.assign(B,{cur:B.cur+1, qn:0, q:null, show:false, ev:[], stamp:null, gold:false});
    commit(); maybeFx();
  },
  timer(sec){ S.timer = sec ? {end: now()+sec*1000} : null; commit(); },
  adj(g,d){ S.adj[g]=(Number(S.adj[g])||0)+d; commit(); },
  reset(){
    if(!confirmReset){ confirmReset=true; render(); setTimeout(()=>{confirmReset=false;render();},4000); return; }
    confirmReset=false; const r=S.rev; S=fresh(S.groups); S.rev=r; live={}; if(answersRef) answersRef.remove().catch(()=>{}); commit();
  }
};

}
function queueHTML(){

function controlsHTML(){
  const k=stepKey();
  const nav = `<div class="steps" role="list">${STEPS.map((s,i)=>`<button class="step" role="listitem" data-t="go" data-v="${i}" ${i===S.step?'aria-current="step"':''}>${esc(s.label)}</button>`).join('')}</div>`;
  let acts = '';
  if(k==='battle'){
    const B=S.battle, p=B.pairs[B.cur];
    const per = `<label class="status" for="bper">ประโยคต่อคู่</label><select id="bper" data-t="bper">${[1,2,3,4,5].map(n=>`<option ${n===B.per?'selected':''}>${n}</option>`).join('')}</select>`;
    if(!p){
      acts = `<div class="row">${per}<button class="btn primary" data-t="bpair">${B.pairs.length?'สุ่มจับคู่รอบใหม่':'สุ่มจับคู่ Battle'}</button><span class="status">ระบบเลี่ยงคู่ที่เคยเจอกันแล้วเท่าที่ทำได้</span></div>`;
    } else {
      const [a,b]=p, canDraw = B.qn<B.per && (B.q==null || B.show), off = B.q==null?'disabled':'';
      const hits = B.ev.filter(e=>e.qn===B.qn);
      const sp = (g)=>{ const h=hits.find(e=>e.g==g); return `<div class="sp"><b>กลุ่ม ${g}</b>${h?`<span class="tag good">ได้ +${h.v} แล้ว</span>`:`<button class="btn sm yesb" data-t="bpt" data-g="${g}" ${off||(hits.length>=2?'disabled':'')}>ตบถูก${hits.length?'ทีหลัง +3':'ก่อน +5'}</button>`}</div>`; };
      acts = `<div class="row">${per}
        <button class="btn ${B.q==null?'primary':''}" data-t="bdraw" ${canDraw?'':'disabled'}>${B.q==null?'สุ่มประโยค':'สุ่มประโยคต่อไป'}</button>
        ${B.q!=null&&!B.show?`<button class="btn primary" data-t="bshow">เฉลยคำ</button>`:''}
        ${B.qn>=B.per&&B.show?`<button class="btn primary" data-t="bend">จบ Battle คู่นี้</button>`:''}</div>
        <div class="scorepad">${sp(a)}${sp(b)}<button class="btn sm ghost" data-t="bundo" ${B.ev.length?'':'disabled'}>ยกเลิกแสตมป์ล่าสุด</button><span class="status">ตบผิดไม่ได้แสตมป์ ไม่ต้องกดอะไร</span></div>`;
    }
  } else if(k!=='lobby' && k!=='end'){
    acts = `<div class="row">
      ${S.open?`<button class="btn" data-t="lock">ปิดรับคำตอบ</button>`:`<button class="btn ghost" data-t="unlock">เปิดรับคำตอบอีกครั้ง</button>`}
      ${k!=='compose'?(S.reveal?'':`<button class="btn primary" data-t="reveal">เฉลย</button>`):''}
      <span class="status">จับเวลา</span>
      <button class="btn sm ghost" data-t="timer" data-v="60">1 นาที</button><button class="btn sm ghost" data-t="timer" data-v="120">2 นาที</button><button class="btn sm ghost" data-t="timer" data-v="180">3 นาที</button>
      ${S.timer?`<button class="btn sm ghost" data-t="timer" data-v="0">หยุด</button>`:''}
    </div>`;
  }
  const next = S.step<STEPS.length-1 ? `<button class="btn primary" data-t="go" data-v="${S.step+1}">ด่านต่อไป: ${esc(STEPS[S.step+1].label)} →</button>` : '';
  return `<div class="panel">${nav}${acts}<div class="row" style="justify-content:space-between">${S.step>0?`<button class="btn ghost" data-t="go" data-v="${S.step-1}">← ย้อนกลับ</button>`:'<span></span>'}${next}</div></div>`;
}

function gcardHTML(g){
  const k=stepKey(), a=answerFor(g,k), on = live[g]&&live[g].online;
  const dot = `<span class="dot ${on?'on':''}" title="${on?'จอนี้ออนไลน์':'ไม่ได้เชื่อมต่อ'}"></span>`;
  let body='', cls='';
  if(k==='lobby'){
    body = `<div class="ans ${on?'':'empty'}">${on?'เข้าห้องแล้ว':'ยังไม่เข้า'}</div>`;
  } else if(isClap(k)){
    const r = S.res[k]&&S.res[k][g];
    cls = r===true?'ok':(r===false?'no':'');
    let txt = '<div class="ans empty">ยังไม่ส่ง</div>';
    if(a && typeof a==='object'){
      txt = a.ok ? `<div class="ans"><span class="tag good">ประโยคนี้ถูกแล้ว</span>${a.text?' '+esc(clip(a.text,200)):''}</div>` : `<div class="ans">${esc(clip(a.text,200))||'<i>ว่าง</i>'}</div>`;
    }
    body = txt + `<div class="judge"><button class="btn sm yes" data-t="judge" data-k="${k}" data-g="${g}" data-v="1" aria-pressed="${r===true}">ถูก ${S.stamps[k]?'+'+S.stamps[k]:''}</button><button class="btn sm noo" data-t="judge" data-k="${k}" data-g="${g}" data-v="0" aria-pressed="${r===false}">ยังไม่ถูก</button></div>`;
  } else if(k==='ladder'){
    const w = S.res.ladder && S.res.ladder[g];
    const sets = LADDER.map((L,i)=>{
      const x = a && a[i];
      if(!Array.isArray(x)||!x.length) return `<span class="mark n">ชุด ${i+1}: —</span>`;
      const okk = x.length===3 && x.every((y,j)=>y===L.order[j]);
      return `<span class="mark ${okk?'y':'n'}">ชุด ${i+1}: ${x.map(esc).join(' → ')} ${okk?'✓':'✗'}</span>`;
    }).join('<br>');
    const auto = a ? wrongCount(a) : null;
    body = `<div class="ans ${a?'':'empty'}">${a?sets:'ยังไม่ส่ง'}</div>
      <label class="row status">ผิด <select data-t="lw" data-g="${g}" aria-label="จำนวนชุดที่ผิดของกลุ่ม ${g}"><option value="">–</option>${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${w===n?'selected':''}>${n}</option>`).join('')}</select> ชุด ${typeof w==='number'?`→ ${LADDER_PAY[w]} คะแนน`:(auto!==null?`(ระบบนับได้ ${auto})`:'')}</label>`;
    cls = typeof w==='number' ? (w===0?'ok':'') : '';
  } else if(k==='compose'){
    const r = S.res.compose&&S.res.compose[g];
    cls = r===true?'ok':(r===false?'no':'');
    body = (a&&typeof a==='object'&&(a.word||a.text)) ? `<div class="ans">${a.word?`<span class="tag">${esc(clip(a.word,20))}</span> `:''}${esc(clip(a.text,240))}</div>` : '<div class="ans empty">ยังไม่ส่ง</div>';
    body += `<div class="judge"><button class="btn sm yes" data-t="judge" data-k="compose" data-g="${g}" data-v="1" aria-pressed="${r===true}">ตรงน้ำหนัก +10</button><button class="btn sm noo" data-t="judge" data-k="compose" data-g="${g}" data-v="0" aria-pressed="${r===false}">ยังไม่ตรง</button></div>`;
  } else if(k==='battle'){
    const B=S.battle, idx=B.pairs.findIndex(x=>x.includes(g)), mine=S.bt.filter(x=>x.g==g);
    let st;
    if(!B.pairs.length) st='รอจับคู่';
    else if(B.bye===g && B.cur<B.pairs.length) st='พักรอบนี้';
    else if(idx===B.cur) st=`กำลังแข่ง · ได้ ${bScore(g)} คะแนน`;
    else if(idx>B.cur) st=`รอคิว คู่ที่ ${idx+1}`;
    else st='แข่งรอบนี้แล้ว';
    cls = idx===B.cur&&B.cur<B.pairs.length ? 'ok' : '';
    body = `<div class="ans">${esc(st)}</div><div class="row">${mine.map(x=>miniHTML(x.v)).join('')||'<span class="status">ยังไม่ได้แสตมป์จาก Battle</span>'}</div>`;
  } else {
    body = `<div class="row">${earned(g).map(miniHTML).join('')||'<span class="status">ยังไม่มีแสตมป์</span>'}</div>`;
  }
  return `<div class="gcard ${cls}"><div class="ghead"><span class="gname">${dot}กลุ่ม ${g}</span><span class="status">${total(g)} คะแนน</span></div>${body}</div>`;
}

    <div class="chips">${earned(r.g).map(miniHTML).join('')}${S.adj[r.g]?`<span class="status">ปรับ ${S.adj[r.g]>0?'+':''}${S.adj[r.g]}</span>`:''}</div></div>`).join('')}</div>

function groupAnswerHTML(){
  const k=stepKey();
  const closed = !S.open;
  const dis = closed ? 'disabled' : '';
  const sentLine = sent[k] ? `<span class="status ok">ส่งแล้ว ${sent[k].toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})} · แก้แล้วส่งใหม่ได้จนกว่าครูจะปิดรับ</span>` : `<span class="status">ยังไม่ได้ส่ง</span>`;
  const closedLine = closed ? `<span class="status">ครูปิดรับคำตอบแล้ว</span>` : sentLine;
  if(k==='lobby'){
    return `<div class="panel"><h3>${myGroup?`คุณอยู่กลุ่ม ${myGroup}`:'เลือกเลขกลุ่มของคุณ'}</h3><div class="grouppick">${groupsList().map(g=>`<button class="btn ${g===myGroup?'primary':''}" data-a="pick" data-v="${g}">กลุ่ม ${g}</button>`).join('')}</div><span class="status">ใช้เครื่องเดียวต่อกลุ่ม รอครูเริ่มด่านแรก</span></div>`;
  }
  if(isClap(k)){
    const d = drafts[k]||{text:'',ok:false};
    let res='';
    if(S.reveal){ const r=S.res[k]&&S.res[k][myGroup]; res = `<div class="big-result">${r===true?`${miniHTML(S.stamps[k]||0)} ได้แสตมป์ ${S.stamps[k]||0} คะแนน`:(r===false?'ข้อนี้ยังไม่ได้แสตมป์':'ครูกำลังตรวจ')}</div>`; }
    return `<div class="panel"><label for="in-${k}"><h3>แก้ประโยคให้ใช้คำระดับเดียวกัน</h3></label>
      <textarea id="in-${k}" data-a="text" ${dis||(d.ok?'disabled':'')} placeholder="พิมพ์ประโยคที่แก้แล้ว">${esc(d.text)}</textarea>
      <div class="row"><button class="btn ${d.ok?'primary':''}" data-a="okToggle" aria-pressed="${!!d.ok}" ${dis}>${d.ok?'✓ ':''}ประโยคนี้ถูกแล้ว</button>
      <button class="btn primary" data-a="send" ${dis}>ส่งคำตอบ</button>${closedLine}</div>${res}</div>`;
  }
  if(k==='ladder'){
    const d = drafts.ladder || [];
    const sets = LADDER.map((L,i)=>{
      const cur = d[i]||[];
      const mk = S.reveal ? (()=>{const ok=cur.length===3&&cur.every((y,j)=>y===L.order[j]);return `<span class="mark ${ok?'y':'n'}">${ok?'✓ ถูก':'✗ ที่ถูก: '+L.order.map(esc).join(' → ')}</span>`})() : '';
      return `<div class="lset"><h3>ชุดที่ ${i+1} ${mk}</h3>
        <div class="cards">${L.show.map(w=>`<button class="wcard" data-a="lw" data-i="${i}" data-w="${esc(w)}" ${cur.includes(w)||closed?'disabled':''}>${esc(w)}</button>`).join('')}</div>
        <div class="slots">${[0,1,2].map(j=>`<button class="slot ${cur[j]?'filled':''}" data-a="lclear" data-i="${i}" data-j="${j}" ${closed||!cur[j]?'disabled':''} aria-label="ขั้นที่ ${j+1}${cur[j]?' '+esc(cur[j])+' แตะเพื่อเอาออก':' ว่าง'}"><small>${['เบา','กลาง','หนัก'][j]}</small>${cur[j]?esc(cur[j]):''}</button>`).join('')}</div></div>`;
    }).join('');
    let res='';
    if(S.reveal){ const w=S.res.ladder&&S.res.ladder[myGroup]; res = typeof w==='number' ? `<div class="big-result">${LADDER_PAY[w]?miniHTML(LADDER_PAY[w]):''} ผิด ${w} ชุด ได้ ${LADDER_PAY[w]} คะแนน</div>` : `<div class="big-result">ครูกำลังตรวจ</div>`; }
    return `<div class="panel"><h3>แตะคำตามลำดับจากเบาไปหนัก แตะช่องบันไดเพื่อเอาคำออก</h3><div class="ladder">${sets}</div><div class="row"><button class="btn primary" data-a="send" ${dis}>ส่งทั้ง 5 ชุด</button>${closedLine}</div>${res}</div>`;
  }
  if(k==='battle'){
    const B=S.battle, idx=B.pairs.findIndex(x=>x.includes(myGroup));
    let msg;
    if(!B.pairs.length) msg='รอครูสุ่มจับคู่ Battle';
    else if(B.cur>=B.pairs.length) msg='จบรอบนี้แล้ว รอครูสุ่มจับคู่รอบใหม่';
    else if(B.bye===myGroup) msg='รอบนี้กลุ่มของคุณพัก ช่วยกันคิดคำตอบในใจไปด้วย';
    else if(idx===B.cur){ const p=B.pairs[idx], o=p[0]===myGroup?p[1]:p[0]; msg=`ถึงตากลุ่มของคุณ! ส่งตัวแทนถือไม้ตีแมลงวันไปที่กระดาน · แข่งกับกลุ่ม ${o} · ตอนนี้ ${bScore(myGroup)} : ${bScore(o)} คะแนน`; }
    else if(idx>B.cur) msg=`กลุ่มของคุณอยู่คู่ที่ ${idx+1} เตรียมตัวแทนไว้`;
    else msg='กลุ่มของคุณแข่งรอบนี้แล้ว';
    const mine=S.bt.filter(x=>x.g==myGroup);
    return `<div class="panel"><div class="big-result">${esc(msg)}</div><div class="row">${mine.map(x=>miniHTML(x.v)).join('')}</div>${B.round?histHTML(B.round):''}</div>`;
  }
  if(k==='compose'){
    const d = drafts.compose || {word:'',text:''};
    const r = S.res.compose&&S.res.compose[myGroup];
    const res = r===true?`<div class="big-result">${miniHTML(10)} ใช้คำได้ตรงน้ำหนัก ได้ 10 คะแนน</div>`:(r===false?`<div class="big-result">ครูเห็นว่ายังไม่ตรงน้ำหนัก</div>`:'');
    return `<div class="panel"><h3>1. เลือกคำ 1 คำ</h3>
      <div class="wordpick">${LADDER.map(L=>L.order).flat().map(w=>`<button class="wcard" data-a="word" data-w="${esc(w)}" aria-pressed="${d.word===w}" ${dis}>${esc(w)}</button>`).join('')}</div>
      <label for="in-compose"><h3>2. แต่งประโยค</h3></label>
      <textarea id="in-compose" data-a="ctext" ${dis} placeholder="แต่งประโยคที่ใช้คำนี้ให้ตรงน้ำหนัก">${esc(d.text)}</textarea>
      <div class="row"><button class="btn primary" data-a="send" ${dis||(!d.word?'disabled':'')}>ส่งประโยค</button>${closedLine}</div>${res}</div>`;
  }
  return '';
}

  }
  if(!haveState){
    return header() + `<div class="panel stage"><h2>รอครูเปิดห้อง ${esc(roomId)}</h2><p>ถ้ารอนานเกินไป ตรวจว่ารหัสห้องถูกต้อง</p><div class="row"><button class="btn sm ghost" data-a="leaveroom">เปลี่ยนรหัสห้อง</button></div></div>`;
  }
  if(!myGroup && stepKey()!=='lobby'){
    return header() + `<div class="panel"><h3>เลือกเลขกลุ่มก่อนเริ่ม</h3><div class="grouppick">${groupsList().map(g=>`<button class="btn" data-a="pick" data-v="${g}">กลุ่ม ${g}</button>`).join('')}</div></div>`;
  }
  const change = myGroup && stepKey()==='lobby' ? '' : (myGroup?`<div class="row" style="justify-content:flex-end"><button class="btn sm ghost" data-a="unpick">เปลี่ยนกลุ่ม</button></div>`:'');
  return header() + stageHTML(false) + groupAnswerHTML() + change;
}

let ready=false, haveState=false;
function render(){
  ensure();
  const app = $('#app');
  const ae = document.activeElement, aid = ae && ae.id, ss = ae && ae.selectionStart, se = ae && ae.selectionEnd;
  if(role==='teacher') app.innerHTML = teacherHTML();
  else if(role==='group') app.innerHTML = groupHTML();
  else return;
  if(aid){ const el=document.getElementById(aid); if(el){ el.focus(); try{ if(ss!=null) el.setSelectionRange(ss,se); }catch(e){} } }
  document.querySelectorAll('.qr[data-qr]').forEach(el=>{ if(window.QRCode && roomId){ try{ new QRCode(el,{text:studentURL(), width:Number(el.dataset.qr), height:Number(el.dataset.qr), colorDark:'#1C2541', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M}); }catch(e){} } });
  tick();
  if(justStamped && !spinning) setTimeout(()=>{justStamped=null;},600);
}

function tick(){
  const el=$('#timer'); if(!el||!S.timer) return;
  const left=Math.max(0,Math.round((S.timer.end-now())/1000));
  el.textContent = left>0 ? `⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}` : 'หมดเวลา';
  el.classList.toggle('low', left<=10);
}
setInterval(tick,1000);

/* ---------- events ---------- */
document.addEventListener('click',(e)=>{
  const b = e.target.closest('[data-t],[data-a]'); if(!b || b.disabled) return;
  const t=b.dataset.t, a=b.dataset.a, v=b.dataset.v;
  if(t && role==='teacher'){
    if(t==='go') T.go(Number(v));
    else if(t==='lock') T.lock();
    else if(t==='unlock') T.unlock();
    else if(t==='reveal') T.reveal();
    else if(t==='judge') T.judge(b.dataset.k, Number(b.dataset.g), v==='1');
    else if(t==='spin') T.spin();
    else if(t==='stamp') T.stamp(Number(v));
    else if(t==='timer') T.timer(Number(v));
    else if(t==='adj') T.adj(Number(b.dataset.g), Number(v));
    else if(t==='reset') T.reset();
    else if(t==='bpair') T.bPair();
    else if(t==='signin'){ authErr=''; auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{ authErr = e && e.code==='auth/unauthorized-domain' ? 'โดเมนนี้ยังไม่ได้เพิ่มใน Firebase (Authentication › Settings › Authorized domains)' : 'เข้าระบบไม่สำเร็จ ลองอีกครั้ง'; render(); }); }
    else if(t==='signout'){ auth.signOut(); }
    else if(t==='room'){ const r=cleanRoom(($('#roomcode')||{}).value); if(r) openRoom(r); }
    else if(t==='bdraw') T.bDraw();
    else if(t==='bshow') T.bShow();
    else if(t==='bpt') T.bHit(Number(b.dataset.g));
    else if(t==='bundo') T.bUndo();
    else if(t==='bend') T.bEnd();
    else if(t==='bstamp') T.bStamp(Number(v));
    else if(t==='bgold') T.bGold();
    else if(t==='sound'){ soundOn=!soundOn; lsSet('stampgame.sound',soundOn); if(soundOn) beep(660,.08); render(); }
    return;
  }
  if(a && role==='group'){
    const k=stepKey();
    if(a==='pick') pickGroup(Number(v));
    else if(a==='unpick'){ unmarkOnline(myGroup); myGroup=null; lsSet('stampgame.group.'+roomId,null); render(); }
    else if(a==='leaveroom'){ detach(); roomId=null; try{ history.replaceState(null,'',location.pathname); }catch(e){} render(); }
    else if(a==='joinroom'){ const r=cleanRoom(($('#roomin')||{}).value); if(r) openRoom(r); }
    else if(a==='okToggle'){ const d=drafts[k]||{text:'',ok:false}; d.ok=!d.ok; drafts[k]=d; saveDrafts(); render(); }
    else if(a==='send') sendAnswer();
    else if(a==='lw'){ const i=Number(b.dataset.i); drafts.ladder=drafts.ladder||[]; const cur=drafts.ladder[i]=drafts.ladder[i]||[]; if(cur.length<3 && !cur.includes(b.dataset.w)) cur.push(b.dataset.w); saveDrafts(); render(); }
    else if(a==='lclear'){ const i=Number(b.dataset.i), j=Number(b.dataset.j); const cur=(drafts.ladder||[])[i]; if(cur){ cur.splice(j,1); saveDrafts(); render(); } }
    else if(a==='word'){ drafts.compose=drafts.compose||{word:'',text:''}; drafts.compose.word=b.dataset.w; saveDrafts(); render(); }
  }
});
document.addEventListener('keydown',(e)=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='roomin'){ const r=cleanRoom(e.target.value); if(r) openRoom(r); }
  if(e.target.id==='roomcode' && role==='teacher'){ const r=cleanRoom(e.target.value); if(r) openRoom(r); }
});
document.addEventListener('input',(e)=>{
  const el=e.target; if(role!=='group') return;
  const k=stepKey();
  if(el.dataset.a==='text'){ const d=drafts[k]||{text:'',ok:false}; d.text=clip(el.value,300); drafts[k]=d; saveDrafts(); }
  if(el.dataset.a==='ctext'){ drafts.compose=drafts.compose||{word:'',text:''}; drafts.compose.text=clip(el.value,300); saveDrafts(); }
});
document.addEventListener('change',(e)=>{
  const el=e.target; if(role!=='teacher') return;
  if(el.dataset.t==='lw') T.ladderWrong(Number(el.dataset.g), el.value);
  if(el.dataset.t==='groups') T.groups(Number(el.value));
  if(el.dataset.t==='bper') T.bPer(Number(el.value));
});

/* ---------- suspense effects ---------- */
let soundOn = lsGet('stampgame.sound') !== false;
let actx = null, lastFx = null, fxTimers = [];
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function beep(f,dur,type='square',vol=.06){
  if(!soundOn || role!=='teacher') return;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(vol,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur+.02);
  }catch(e){}
}
const later=(ms,f)=>fxTimers.push(setTimeout(f,ms));
function fxEl(){
  let el=$('#fx');
  if(!el){ el=document.createElement('div'); el.id='fx'; el.hidden=true; document.body.appendChild(el);
    el.addEventListener('click',()=>{ if(role==='teacher') fxHide(); }); }
  return el;
}
function fxHide(){ fxTimers.forEach(clearTimeout); fxTimers=[]; fxEl().hidden=true; }
function maybeFx(){
  const f = S.battle && S.battle.fx;
  if(!f || f.id===lastFx) return;
  lastFx = f.id;
  if(Math.abs(now()-f.at) > 30000) return;
  if(stepKey()!=='battle') return;
  fxHide();
  if(f.type==='pair') playPair();
  else if(f.type==='reveal') playReveal();
  else if(f.type==='win') playWin(f);
  else playDraw();
}
function fanfare(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,i===3?.45:.13,'triangle',.11),i*120)); setTimeout(()=>beep(1568,.25,'sine',.05),520); }
function confetti(ms=2600){
  if(RM) return;
  const cv=document.createElement('canvas'); cv.className='confetti'; document.body.appendChild(cv);
  const ctx=cv.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1);
  const W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr;
  const cs=getComputedStyle(document.documentElement);
  const cols=['--s1','--s3','--s5','--s7','--s10','--gold'].map(v=>cs.getPropertyValue(v).trim()||'#C8321C');
  const P=[]; for(let i=0;i<170;i++){ const left=i%2===0;
    P.push({x:left?0:W, y:H*0.85, vx:(left?1:-1)*(6+Math.random()*12)*dpr, vy:-(14+Math.random()*16)*dpr, w:(6+Math.random()*8)*dpr, h:(8+Math.random()*10)*dpr,
      r:Math.random()*6.28, vr:(Math.random()-.5)*.35, sw:Math.random()*6.28, c:cols[i%cols.length]}); }
  const t0=performance.now();
  (function frame(now){
    const el=now-t0; ctx.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy+=0.45*dpr; p.vx*=0.985; p.vy*=0.985; p.x+=p.vx+Math.sin(p.sw+=0.12)*1.2*dpr; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=Math.max(0,1-Math.max(0,el-ms+700)/700);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2*Math.abs(Math.cos(p.sw)),p.w,p.h*Math.abs(Math.cos(p.sw))+1); ctx.restore(); });
    if(el<ms) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}
function playReveal(){ fanfare(); confetti(); }
function playWin(f){
  const el=fxEl();
  el.innerHTML = f.w ? `<div class="fxbox"><span class="fxeyebrow">จบ Battle · กลุ่ม ${f.a} ${f.sa} : ${f.sb} กลุ่ม ${f.b}</span><h2 class="fxtitle">กลุ่ม ${f.w} ชนะ!</h2>
      <img class="fxbonus" src="${IMG[3]}" alt="แสตมป์โบนัส 3 คะแนน" width="170" height="192"><span class="fxbye show">ได้แสตมป์โบนัสผู้ชนะ +3 คะแนน</span>${role==='teacher'?'<span class="fxhint">แตะเพื่อปิด</span>':''}</div>`
    : `<div class="fxbox"><span class="fxeyebrow">จบ Battle</span><h2 class="fxtitle">กลุ่ม ${f.a} ${f.sa} : ${f.sb} กลุ่ม ${f.b} · เสมอ</h2><span class="fxbye show">คู่นี้ไม่มีโบนัสผู้ชนะ</span></div>`;
  el.hidden=false;
  if(f.w){ fanfare(); later(150,()=>confetti(3000)); }
  later(RM?1500:3600, fxHide);
}
function playPair(){
  const B=S.battle, el=fxEl(), gs=groupsList();
  el.innerHTML = `<div class="fxbox"><span class="fxeyebrow">เกมตบคำ · รอบที่ ${B.round}</span><h2 class="fxtitle">สุ่มจับคู่ Battle</h2>
    ${B.pairs.map((p,i)=>`<div class="fxpair"><span class="fxslot" id="fxs-${i}-0">?</span><span class="fxvs">VS</span><span class="fxslot" id="fxs-${i}-1">?</span></div>`).join('')}
    <div class="fxbye" id="fxbye">${B.bye?`กลุ่ม ${B.bye} พักรอบนี้`:''}</div>${role==='teacher'?'<span class="fxhint">แตะเพื่อปิด</span>':''}</div>`;
  el.hidden=false;
  const per = RM ? 150 : 900; let t0 = RM ? 100 : 500;
  B.pairs.forEach((p,i)=>[0,1].forEach(j=>{
    const id=`fxs-${i}-${j}`, start=t0; t0+=per;
    if(!RM){ for(let s=0; s<per-150; s+=70) later(start+s,()=>{ const e=$('#'+id); if(e){ e.textContent=gs[Math.floor(Math.random()*gs.length)]; e.classList.add('spin'); beep(900+Math.random()*300,.03); } }); }
    later(start+per-100,()=>{ const e=$('#'+id); if(e){ e.textContent=p[j]; e.classList.remove('spin'); e.classList.add('lock'); beep(180,.18,'triangle',.12); } });
  }));
  later(t0, ()=>{ const e=$('#fxbye'); if(e) e.classList.add('show'); beep(523,.12,'triangle',.08); later(130,()=>beep(784,.25,'triangle',.08)); });
  later(t0 + (RM?800:2600), fxHide);
}
function playDraw(){
  const B=S.battle, el=fxEl(), q=B.q, prev=B.used.slice(0,-1);
  const pool = SLAP.map((_,i)=>i).filter(i=>!prev.includes(i));
  el.innerHTML = `<div class="fxbox"><span class="fxeyebrow">กลุ่ม ${B.pairs[B.cur][0]} VS กลุ่ม ${B.pairs[B.cur][1]} · ประโยคที่ ${B.qn} จาก ${B.per}</span><h2 class="fxtitle">สุ่มประโยค</h2>
    <div class="fxdeck">${SLAP.map((_,i)=>`<span class="fxcard ${prev.includes(i)?'used':''}" id="fxc-${i}">${i+1}</span>`).join('')}</div>
    <div class="fxbig" id="fxbig"></div>${role==='teacher'?'<span class="fxhint">แตะเพื่อปิด</span>':''}</div>`;
  el.hidden=false;
  let t0=0, d=RM?0:55, last=-1;
  const hop=(i)=>{ if(last>=0){ const o=$('#fxc-'+last); if(o) o.classList.remove('on'); } const c=$('#fxc-'+i); if(c) c.classList.add('on'); last=i; beep(1000,.025); };
  if(!RM){ while(t0<2300){ const i=pool[Math.floor(Math.random()*pool.length)]; later(t0,()=>hop(i)); t0+=d; d*=1.13; } }
  later(t0,()=>{ hop(q); const c=$('#fxc-'+q); if(c) c.classList.add('pick'); beep(220,.25,'triangle',.12); });
  t0 += RM?300:700;
  if(B.gold) { later(t0,()=>{ const b=$('#fxbig'); if(b){ b.innerHTML='<span class="fxgold">ประโยคทอง!<small>ตบถูกได้ 2 แต้ม</small></span>'; } beep(784,.15,'triangle',.1); later(150,()=>beep(1047,.3,'triangle',.1)); }); t0 += RM?600:1500; }
  ['3','2','1','ตบ!'].forEach((n,k)=>{ later(t0+k*(RM?250:750),()=>{ const b=$('#fxbig'); if(b){ b.innerHTML=`<span class="fxnum ${n==='ตบ!'?'go':''}">${n}</span>`; } beep(n==='ตบ!'?880:440,n==='ตบ!'?.35:.12,'square',.08); }); });
  later(t0+4*(RM?250:750)+300, fxHide);
}

/* ---------- boot ---------- */
function detach(){ unsubs.forEach(f=>{ try{ f(); }catch(e){} }); unsubs=[]; answersRef=null; onlineRef=null; stateRef=null; }
function listen(ref, cb){ ref.on('value', cb, ()=>{}); unsubs.push(()=>ref.off('value', cb)); }
function openRoom(r){
  r=cleanRoom(r); if(!r || !fdb) return;
  if(role==='group' && myGroup) unmarkOnline(myGroup);
  detach(); roomId=r; live={}; answersData={}; onlineData={}; haveState=false;
  const base=fdb.ref('rooms/'+r);
  answersRef=base.child('answers'); onlineRef=base.child('online');
  if(role==='teacher'){
    stateRef=base.child('state');
    lsSet('stampgame.lastroom', r);
    const saved=lsGet(tkey()); S=(saved && saved.v===1) ? saved : fresh(S.groups||6); ensure();
    lastFx = S.battle.fx ? S.battle.fx.id : null;
    listen(stateRef, snap=>{
      const d=snap.val();
      if(!d || d.v!==1){ push(); return; }
      if((d.rev||0) > (S.rev||0)){ S=d; ensure(); lsSet(tkey(),S); lastFx = S.battle.fx ? S.battle.fx.id : lastFx; render(); }
    });
    listen(answersRef, s=>{ answersData=s.val()||{}; buildLive(); render(); });
    listen(onlineRef, s=>{ onlineData=s.val()||{}; buildLive(); render(); });
  } else {
    try{ history.replaceState(null,'',location.pathname+'?r='+encodeURIComponent(r)); }catch(e){}
    myGroup = lsGet('stampgame.group.'+r) || null;
    drafts = lsGet('stampgame.drafts.'+r) || {};
    listen(base.child('state'), snap=>{
      const d=snap.val();
      if(!d || d.v!==1){ haveState=false; render(); return; }
      const first=!haveState; haveState=true;
      const k0=stepKey(), before=S.stamps&&S.stamps[k0];
      S=d; ensure();
      if(first) lastFx = S.battle.fx ? S.battle.fx.id : null;
      if(drafts._gid!==S.gid){ drafts={_gid:S.gid}; saveDrafts(); sent={}; }
      const k1=stepKey();
      if(isClap(k1) && S.stamps[k1] && (k1!==k0 || S.stamps[k1]!==before)) justStamped=k1;
      render(); maybeFx();
    });
    if(myGroup) markOnline(myGroup);
  }
  render();
}
function boot(){
  const qs=new URLSearchParams(location.search);
  role = qs.has('t') ? 'teacher' : 'group';
  try{ firebase.initializeApp(FB); fdb=firebase.database(); fbOk=true; }catch(e){ fbOk=false; }
  ready=true;
  if(!fbOk){ if(role==='teacher'){ const s=lsGet('stampgame.teacher.local'); if(s && s.v===1) S=s; } render(); return; }
  fdb.ref('.info/serverTimeOffset').on('value', s=>{ serverOffset=Number(s.val())||0; });
  fdb.ref('.info/connected').on('value', s=>{ connected=!!s.val(); if(connected && role==='group' && myGroup && roomId) markOnline(myGroup); render(); });
  if(role==='teacher'){
    auth=firebase.auth();
    auth.onAuthStateChanged(u=>{ user=u; authErr=''; if(u) openRoom(lsGet('stampgame.lastroom')||'601'); else { detach(); roomId=null; render(); } });
  } else {
    const r=cleanRoom(qs.get('r')); if(r) openRoom(r);
  }
  render();
}
boot();
})();
</script>
